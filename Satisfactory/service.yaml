---
apiVersion: v1
kind: Service
metadata:
  name: satisfactory-server
  namespace: default
  labels:
    app: satisfactory-server
spec:
  type: NodePort
  selector:
    app: satisfactory-server
  # Satisfactory 1.0 uses the SAME port number for the reliable (TCP) and
  # unreliable (UDP) channels, so both entries share nodePort 30018. Kubernetes
  # allows this because nodePort uniqueness is per (port, protocol).
  #
  # The container is told to listen on the nodePort numbers directly
  # (SERVERGAMEPORT / SERVERMESSAGINGPORT in the StatefulSet) so there is no
  # port translation. That matters: the server advertises its own game port to
  # clients, and if it advertised 7777 while the outside world had to use 30018,
  # clients would be sent to a port that isn't published.
  ports:
    - name: game-tcp
      port: 30000
      targetPort: game-tcp
      nodePort: 30000
      protocol: TCP
    - name: game-udp
      port: 30000
      targetPort: game-udp
      nodePort: 30000
      protocol: UDP
    - name: messaging
      port: 30001
      targetPort: messaging
      nodePort: 30001
      protocol: TCP
